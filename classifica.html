<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classifica FIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="theme-color" content="#2c3e50">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">


  <script type="module" crossorigin src="/bsk-tst-2026/assets/classifica-B1lxZ898.js"></script>
  <link rel="modulepreload" crossorigin href="/bsk-tst-2026/assets/modulepreload-polyfill-D8of4RaW.js">
  <link rel="modulepreload" crossorigin href="/bsk-tst-2026/assets/myTeamConfig-DUTITc-i.js">
  <link rel="stylesheet" crossorigin href="/bsk-tst-2026/assets/classifica-CXpcPQRF.css">
</head>
<body style="height: 100dvh; height: 100vh; overflow: hidden; margin: 0;">

<div class="container" style="height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 10px; box-sizing: border-box;">
    <div class="header-container" style="flex-shrink: 0; position: sticky; top: 0; z-index: 100; background: inherit;">
        <div class="brand-section">
            <a href="index.html" class="home-btn" aria-label="Home">
                <i class="fas fa-home"></i>
            </a>
            <h2>Classifiche FIP</h2>
        </div>
        <div id="admin-actions" class="hidden" style="display: flex; justify-content: center; gap: 8px; margin: 10px auto 20px auto; max-width: 320px;">
            <button id="btn-refresh-fip" class="fip-btn" style="background-color: #27ae60; border-radius: 10px; padding: 4px 4px; font-size: 1rem; flex: 1;">
                <i class="fas fa-sync-alt" style="font-size: 1.2rem;"></i> Refresh FIP
            </button>
            
            <button id="btn-sync-firebase" class="fip-btn" style="background-color: #e67e22; border-radius: 10px; padding: 4px 4px; font-size: 1rem; flex: 1;">
                <i class="fas fa-cloud-upload-alt" style="font-size: 1.2rem;"></i> Sync Firebase
            </button>
        </div>
    </div>

    <!-- Contenitore del filtro aggiornato con Label + Bottone dinamico/ciclico -->
    <div class="filter-container" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span style="font-size: 1.4rem; font-weight: bold; color: var(--fip-blue);">Campionato:</span>
        <div id="campionato-selector-wrapper">
            <!-- Il bottone ciclico o la stringa fissa verranno generati dinamicamente via JS -->
        </div>
    </div>

    <!-- I DUE BOTTONI POSIZIONATI IN ALTO (dopo i filtri e prima dei contenitori) -->
    <div class="action-buttons-row" style="flex-shrink: 0; margin-bottom: 8px;">
        <button id="btn-calendario-completo" class="unified-bottom-btn" onclick="mostraCalendarioCompleto()">
            <i class="fas fa-calendar-alt"></i> Calendario
        </button>
        
        <a id="fip-external-link" href="#" target="_blank" class="unified-bottom-btn">
            Sito FIP <i class="fas fa-external-link-alt" style="margin-left: 5px;"></i>
        </a>
    </div>

    <div id="hint-classifica" style="flex-shrink: 0; text-align: center; color: #64748b; font-size: 1.2rem; margin-bottom: 10px; font-style: italic;">
        <i class="fas fa-info-circle" style="margin-right: 5px;"></i> Clicca su una squadra per vedere le sue partite...
    </div>

    <div id="table-container" style="flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; margin-bottom: 10px;">
        <div class="loading">Sincronizzazione dati FIP...</div>
    </div>

    <div id="details-container" class="hidden" style="display: flex; flex-direction: column; flex: 1; overflow: hidden; margin-bottom: 10px;">
        <div class="header-details" style="flex-shrink: 0;">
            <button onclick="showClassifica()" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <h3 id="selected-team-name">Nome Squadra</h3>
        </div>
        <div id="team-matches-list" style="flex: 1; overflow-y: auto; overflow-x: hidden;">
        </div>
    </div>

    <!-- Nota classifica provvisoria in basso -->
    <div id="nota-classifica" class="hidden" style="flex-shrink: 0; color: #ef4444; font-size: 1.1rem; font-weight: bold; text-align: center;">
        * classifica provvisoria
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>   

</body>
</html>
